name: ci

on:
  push:
    branches: [main, "Desafio-**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest   # ja inclui Docker (necessario aos testes com Testcontainers)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings sao erros)
        run: dotnet build Verx.Finance.slnx -c Release
      - name: Testes (unitarios, arquitetura e integracao)
        run: dotnet test Verx.Finance.slnx -c Release --no-build --logger "trx"
      - name: Compose valido
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.direct.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.sql.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.load.yml -f docker-compose.scale.yml config -q
