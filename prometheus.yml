global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'lancamentos-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['lancamentos-api:8080']

  - job_name: 'consolidado-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['consolidado-api:8080']

  - job_name: 'bff'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bff:8080']

  # plugin rabbitmq_prometheus (ja habilitado na imagem oficial): profundidade por fila, base do alerta da DLQ
  - job_name: 'rabbitmq'
    metrics_path: '/metrics/detailed'
    params:
      family: ['queue_coarse_metrics']
    static_configs:
      - targets: ['rabbitmq:15692']
